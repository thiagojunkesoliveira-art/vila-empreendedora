name: Publicar versão

# Publishes a new GitHub Release when "version" in package.json changes on main.
# If release vX.Y.Z already exists, the run does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão do package.json
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verificar se a release já existe
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "A release v${{ steps.version.outputs.value }} já existe. Nada a fazer."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Montar o instalador e publicar a release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
