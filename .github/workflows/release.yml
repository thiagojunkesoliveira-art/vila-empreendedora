name: Publicar versão

# Publishes a new GitHub Release when "version" in package.json changes on main.
# If release vX.Y.Z already exists, the run does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ler a versão do package.json
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verificar se a release já existe
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "A release v${{ steps.version.outputs.value }} já existe. Nada a fazer."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Montar o instalador
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win --publish never

      # One release, created in a single step, with the tag on this commit.
      - name: Publicar a release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.value }}"
          gh release create "v$v" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Vila Empreendedora $v" \
            --notes "Baixe o arquivo Vila-Empreendedora-Setup-$v.exe abaixo e abra para instalar." \
            --latest \
            "dist/Vila-Empreendedora-Setup-$v.exe" \
            "dist/Vila-Empreendedora-Setup-$v.exe.blockmap" \
            "dist/latest.yml"
